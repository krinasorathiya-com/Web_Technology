<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="form-card">

        <h1>Student Registration</h1>
        <p class="subtitle">Create your student account</p>

        <form id="registrationForm" novalidate>

            <!-- Name -->
            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    aria-describedby="nameError"
                    required
                >

                <small id="nameError" class="error"></small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    aria-describedby="emailError"
                    required
                >

                <small id="emailError" class="error"></small>
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label for="mobile">Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                    autocomplete="tel"
                    aria-describedby="mobileError"
                    required
                >

                <small id="mobileError" class="error"></small>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    autocomplete="new-password"
                    aria-describedby="passwordError strengthText"
                    required
                >

                <div class="strength-container">
                    <div id="strengthBar"></div>
                </div>

                <small id="strengthText" class="strength-text">
                    Password strength
                </small>

                <small id="passwordError" class="error"></small>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    aria-describedby="confirmPasswordError"
                    required
                >

                <small id="confirmPasswordError" class="error"></small>
            </div>

            <!-- Course -->
            <div class="form-group">
                <label for="course">Course</label>

                <select
                    id="course"
                    name="course"
                    aria-describedby="courseError"
                    required
                >
                    <option value="">-- Select Course --</option>
                    <option value="AIML">AI & ML</option>
                    <option value="CSE">Computer Science</option>
                    <option value="CE">Computer Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="ECE">Electronics & Communication</option>
                </select>

                <small id="courseError" class="error"></small>
            </div>

            <!-- Year -->
            <div class="form-group">
                <label for="year">Year</label>

                <select
                    id="year"
                    name="year"
                    aria-describedby="yearError"
                    required
                >
                    <option value="">-- Select Year --</option>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                </select>

                <small id="yearError" class="error"></small>
            </div>

            <!-- Gender -->
            <fieldset class="gender-group">
                <legend>Gender</legend>

                <div class="radio-options">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>

                </div>

                <small id="genderError" class="error"></small>
            </fieldset>

            <!-- Terms -->
            <div class="terms-group">

                <label class="checkbox-label">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        aria-describedby="termsError"
                    >

                    <span>
                        I agree to the
                        <a href="#" onclick="return false;">
                            Terms and Conditions
                        </a>
                    </span>
                </label>

                <small id="termsError" class="error"></small>

            </div>

            <!-- Submit -->
            <button type="submit" class="submit-btn">
                Register
            </button>

            <!-- Success Message -->
            <div
                id="successMessage"
                class="success-message"
                role="alert"
                aria-live="polite"
            ></div>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
