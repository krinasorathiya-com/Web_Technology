<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="form-card">

        <h1>Student Registration</h1>
        <p class="subtitle"> Student Portal</p>

        <form id="registrationForm">

            <label for="name">Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your full name">
            <span id="nameError"></span>

            <label for="email">Email</label>
            <input type="email" id="email"
                   placeholder="example@gmail.com">
            <span id="emailError"></span>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile"
                   placeholder="10 digit mobile number"
                   maxlength="10">
            <span id="mobileError"></span>

            <label for="course">Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="AIML">B.Tech AI & ML</option>
                <option value="CSE">B.Tech CSE</option>
                <option value="IT">B.Tech IT</option>
                <option value="IT">B.Tech EC</option>
                <option value="CE">B.Tech CE</option>
            </select>
            <span id="courseError"></span>

            <label for="year">Year</label>
            <select id="year">
                <option value="">Select Year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>
            <span id="yearError"></span>

            <fieldset>
                <legend>Gender</legend>

                <label class="radio">
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label class="radio">
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label class="radio">
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>

                <span id="genderError"></span>
            </fieldset>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Create password">

            <div class="strength">
                <div id="strengthBar"></div>
            </div>

            <small id="strengthText">Password strength</small>
            <span id="passwordError"></span>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Re-enter password">
            <span id="confirmError"></span>

            <!-- CAPTCHA -->
            <label for="captchaInput">Enter CAPTCHA</label>

            <canvas id="captchaCanvas"
                    width="180"
                    height="50">
            </canvas>

            <button type="button" id="refreshCaptcha">
                Refresh CAPTCHA
            </button>

            <input type="text" id="captchaInput"
                   placeholder="Enter code shown above">
            <span id="captchaError"></span>

            <!-- Terms -->
            <label class="terms">
                <input type="checkbox" id="terms">
                I agree to the Terms and Conditions
            </label>
            <span id="termsError"></span>

            <button type="submit" class="submit-btn">
                Register Now
            </button>

        </form>
    </div>
</div>

<script src="form.js"></script>
</body>
</html>
