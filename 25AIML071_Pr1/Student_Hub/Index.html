<html>
    <head>
        <title>studentdetails</title>
    </head>
    <body>
        <h1>Student Details</h1>
        <div id="output"></div>
        <script>
            fetch("student.json").then(response => response.json()).then(data => {
                data.forEach(student => {
                    document.getElementById("output").innerHTML +=
                    student.name + "-" +
                    student.marks + "<br>";
                });
            });
        </script>

    </body>
</html>
